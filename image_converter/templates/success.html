<!-- converter/templates/converter/success.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Images Converted</title>
</head>
<style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .container {
            width: 80%;
            margin: 40px auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h1 {
            color: #333;
        }
        h2 {
            color: #555;
            margin-top: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            padding: 10px;
            border: 1px solid #007bff;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
            transition: background-color 0.3s, color 0.3s;
        }
        a:hover {
            background-color: #007bff;
            color: white;
        }
    </style>
<body>
    <h1>Images Converted Successfully!</h1>

    <h2>PNG Image:</h2>
    <img height="1px" width="100px" src="{{ MEDIA_URL }}{{ png_image_path }}" alt="Converted PNG Image">
    <a href="{{ MEDIA_URL }}{{ png_image_path }}" download>Download PNG</a>

    <h2>JPEG Image:</h2>
    <img height="1px" width="100px" src="{{ MEDIA_URL }}{{ jpeg_image_path }}" alt="Converted JPEG Image">
    <a href="{{ MEDIA_URL }}{{ jpeg_image_path }}" download>Download JPEG</a>

    <a href="{% url 'upload_image' %}">Upload another image</a>
</body>
</html>
