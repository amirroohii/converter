<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Converter</title>
</head>
<style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .container {
            width: 80%;
            margin: 40px auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #555;
        }
        nav {
            margin: 20px 0;
        }
        ul {
            list-style-type: none; /* حذف نقاط قبل هر آیتم */
            padding: 0; /* حذف پدینگ */
        }
        li {
            display: inline; /* نمایش به صورت سطری */
            margin: 0 15px; /* فاصله بین لینک‌ها */
        }
        a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            padding: 10px;
            border: 1px solid #007bff;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }
        a:hover {
            background-color: #007bff;
            color: white;
        }
        footer {
            margin-top: 20px;
            color: #777;
        }
    </style>
<body>
    <div class="container">
        <header>
            <h1>Welcome to Image Converter</h1>
            <p>Convert your images to various formats easily and quickly.</p>
        </header>
        <nav>
            <ul>
                <li><a href="{% url 'upload_image' %}">Convert WebP to JPG</a></li>
                <li><a href="{% url 'upload_image' %}">Convert PNG to JPG</a></li>
                <li><a href="{% url 'upload_image' %}">Convert PDF to JPG</a></li>
            </ul>
        </nav>
        <footer>
            <p>&copy; 2024 Image Converter. All rights reserved.</p>
        </footer>
    </div>
</body>

</html>
